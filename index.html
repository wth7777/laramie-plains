<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#111b27">
<meta name="description" content="An original 16-bit-inspired frontier mystery adventure set on the Laramie Plains in 1867.">
<title>Laramie Plains: The Well Beyond the Stars</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="app">
  <header class="topbar">
    <div><div class="eyebrow">A FRONTIER MYSTERY · 1867</div><h1>Laramie Plains</h1></div>
    <button id="helpBtn" class="small-button" aria-label="How to play">?</button>
  </header>
  <section class="game-wrap" aria-label="Game">
    <canvas id="game" width="640" height="400" aria-label="Game world"></canvas>
    <div id="toast" class="toast" role="status"></div>
  </section>
  <section class="hud">
    <div class="hud-left"><span class="heart" id="health">♥ ♥ ♥</span><span id="tool">Tool: Surveyor's chain</span></div>
    <div class="hud-right"><span id="objective">Objective: Find the survey stakes</span><button id="journalBtn" class="small-button">Journal</button></div>
  </section>
  <section class="mobile-controls" aria-label="Touch controls">
    <div class="dpad">
      <button data-dir="up" class="dir up" aria-label="Move up">▲</button>
      <button data-dir="left" class="dir left" aria-label="Move left">◀</button>
      <button data-dir="down" class="dir down" aria-label="Move down">▼</button>
      <button data-dir="right" class="dir right" aria-label="Move right">▶</button>
    </div>
    <div class="action-buttons">
      <button id="interactBtn" class="action">INTERACT</button>
      <button id="toolBtn" class="action secondary">USE TOOL</button>
    </div>
  </section>
  <footer>Made for the family · Original browser adventure · Save data stays on this device</footer>
</main>
<div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="panel"><button id="closeModal" class="close" aria-label="Close">×</button><h2 id="modalTitle">Field Journal</h2><div id="modalBody"></div></div>
</div>
<script src="game.js"></script>
</body>
</html>
